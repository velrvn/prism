<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM — Offline</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
       background:#f2f1ee;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .logo{width:72px;height:72px;border-radius:50%;background:conic-gradient(from 210deg,#7db4d8,#e0608f,#c9a15a,#8fb07a,#7db4d8);
        box-shadow:inset 0 2px 4px rgba(255,255,255,.7),0 10px 30px -10px rgba(0,0,0,.2)}
  h1{font-size:20px;margin:0}
  p{font-size:14px;color:rgba(29,29,31,.55);max-width:300px;line-height:1.5;margin:0}
  button{padding:11px 22px;border-radius:999px;border:0;background:#1d1d1f;color:#fff;font-weight:600;cursor:pointer;font-size:14px}
</style>
</head>
<body>
  <div class="logo"></div>
  <h1>You're offline</h1>
  <p>PRISM hasn't been cached on this device yet. Reconnect to the internet once so the app can download itself for offline use.</p>
  <button onclick="location.replace('./')">Retry</button>
</body>
</html>
